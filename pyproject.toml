[project]
name = "bp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luyijingning", email = "2182716481@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "spacy>=3.6",
    "sentence-transformers>=2.2",
    "bertopic>=0.16",
    "tqdm>=4.65",
    "jupyter>=1.1.1",
]

[project.scripts]
bp = "bp:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
